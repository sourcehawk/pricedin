name: Deploy

# Deploys the server to Fly.io and the web app to Vercel, only when someone
# starts it by hand. A job whose secrets are missing deploys nothing and
# still passes. docs/runbook.md lists the secrets and the first deploy,
# which needs steps that this workflow does not do.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, server, web]
        default: all

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  server:
    if: inputs.target != 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The name of the Fly app. Empty means the app in deploy/fly/server.toml.
      FLY_APP: ${{ vars.FLY_APP }}
      FLYCTL_VERSION: 0.5.1
      FLYCTL_SHA256: 47803bc5dc3eb7c7a45626ff76f0082e8c5b5fb8b805efbe00469d04757e1b1b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the secrets
        id: gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: scripts/deploy-gate.sh server FLY_API_TOKEN
      - name: Install flyctl
        if: steps.gate.outputs.ready == 'true'
        run: |
          archive="flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/${archive}"
          echo "${FLYCTL_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/flyctl"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/flyctl" flyctl
          echo "$RUNNER_TEMP/flyctl" >> "$GITHUB_PATH"
      - name: Deploy the server
        if: steps.gate.outputs.ready == 'true'
        # The release command of server.toml runs the migrations before the
        # new machines start. --ha=false keeps one machine per process group.
        # The config path is absolute, because flyctl changes into server
        # before it reads it.
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -- --config "$GITHUB_WORKSPACE/deploy/fly/server.toml" --remote-only --ha=false
          if [ -n "$FLY_APP" ]; then set -- "$@" --app "$FLY_APP"; fi
          flyctl deploy server "$@"

  web:
    if: inputs.target != 'server'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The Vercel CLI reads the team and the project from these two.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI: vercel@65.8.0
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the secrets
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: scripts/deploy-gate.sh web VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version-file: .tool-versions
      # The project settings on Vercel give the root directory (web) and the
      # environment, such as PRICEDIN_API_URL. The build runs here and
      # uploads only its output.
      - name: Build the web app
        if: steps.gate.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
      - name: Deploy the web app
        if: steps.gate.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN"
