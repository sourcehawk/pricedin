name: pricedin

# Local stack: Postgres, the migrations, the API server and the web app. Host
# ports come from variables, so that two stacks on one machine can avoid each
# other. Every port binds to 127.0.0.1 only, because the default credentials
# are public. Every service also reads .env when it exists; values under
# `environment` win.

services:
  db:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pricedin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricedin}
      POSTGRES_DB: ${POSTGRES_DB:-pricedin}
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${PRICEDIN_DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18 keeps its data in a versioned folder below this path.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Applies the database migrations once, then exits. `serve` does not
  # migrate by itself.
  migrate:
    build:
      context: server
    image: ${PRICEDIN_SERVER_IMAGE:-pricedin-server:dev}
    command: ["migrate", "up"]
    environment:
      # The same database settings as the server; see there.
      PRICEDIN_DATABASE_URL: ""
      PRICEDIN_DATABASE_HOST: db
      PRICEDIN_DATABASE_PORT: "5432"
      PRICEDIN_DATABASE_USER: ${POSTGRES_USER:-pricedin}
      PRICEDIN_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pricedin}
      PRICEDIN_DATABASE_NAME: ${POSTGRES_DB:-pricedin}
      PRICEDIN_DATABASE_SSLMODE: disable
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: server
    image: ${PRICEDIN_SERVER_IMAGE:-pricedin-server:dev}
    environment:
      # The parts need no URL encoding, so the credentials can hold any
      # character. The empty URL overrides one that .env sets for the host.
      PRICEDIN_DATABASE_URL: ""
      PRICEDIN_DATABASE_HOST: db
      PRICEDIN_DATABASE_PORT: "5432"
      PRICEDIN_DATABASE_USER: ${POSTGRES_USER:-pricedin}
      PRICEDIN_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pricedin}
      PRICEDIN_DATABASE_NAME: ${POSTGRES_DB:-pricedin}
      PRICEDIN_DATABASE_SSLMODE: disable
      PRICEDIN_HTTP_ADDR: ":8080"
      PRICEDIN_METRICS_ADDR: ":9090"
      PRICEDIN_BLOB_BACKEND: fs
      PRICEDIN_BLOB_DIR: /data/blob
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - blob-data:/data/blob
    ports:
      - "127.0.0.1:${PRICEDIN_API_PORT:-8080}:8080"
      - "127.0.0.1:${PRICEDIN_METRICS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "/pricedin", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Runs the daily ingestion job at PRICEDIN_SCHEDULE_DAILY (UTC). It calls
  # SEC and Massive, so it needs PRICEDIN_SEC_USER_AGENT and
  # PRICEDIN_MASSIVE_API_KEY in .env, and it starts only with
  # `--profile scheduler`. docker-compose.fixtures.yml runs it against the
  # fixture server instead.
  scheduler:
    profiles: [scheduler]
    build:
      context: server
    image: ${PRICEDIN_SERVER_IMAGE:-pricedin-server:dev}
    command: ["scheduler"]
    environment:
      # The same database and blob settings as the server; see there.
      PRICEDIN_DATABASE_URL: ""
      PRICEDIN_DATABASE_HOST: db
      PRICEDIN_DATABASE_PORT: "5432"
      PRICEDIN_DATABASE_USER: ${POSTGRES_USER:-pricedin}
      PRICEDIN_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pricedin}
      PRICEDIN_DATABASE_NAME: ${POSTGRES_DB:-pricedin}
      PRICEDIN_DATABASE_SSLMODE: disable
      PRICEDIN_BLOB_BACKEND: fs
      PRICEDIN_BLOB_DIR: /data/blob
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - blob-data:/data/blob
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: ${PRICEDIN_WEB_IMAGE:-pricedin-web:dev}
    environment:
      PRICEDIN_API_URL: http://server:8080
    env_file:
      - path: .env
        required: false
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PRICEDIN_WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  db-data:
  blob-data:
